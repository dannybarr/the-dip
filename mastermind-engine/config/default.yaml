# Mastermind Engine — default configuration (profile: BALANCED CONVICTION)
# Every value here traces to a principle in RESEARCH.md.

profile: balanced_conviction

universe:
  # Watchlist for signal generation. Real deployments expand this from a screener.
  # These defaults include the RESEARCH.md exemplar (RACE / Ferrari) plus liquid names.
  tickers: [AAPL, MSFT, NVDA, RACE, JPM, GOOGL, AMZN, META, LLY, COST, V, XOM]
  # NICHE SPECIALISATION (§ differentiate for max upside): instead of trading the whole
  # watchlist uniformly, the engine scores each name's *exploitability* for THIS
  # strategy and concentrates on the best niche — re-selected every fold so the niche
  # EVOLVES as names' behaviour changes.
  auto_select_niche: true
  niche_size: 6              # keep the top-K most exploitable names
  niche_min_history: 252     # require ~1y before a name is eligible for the niche

horizon:            # §2 swing sweet spot: 3d–4wk
  min_hold_days: 3
  max_hold_days: 20     # vertical barrier

labeling:           # §4 triple-barrier (ATR-scaled). Breakeven win-prob = sl/(pt+sl).
  profit_take_atr: 2.0
  stop_loss_atr: 1.5    # breakeven ~0.43 — winnable, still positive payoff asymmetry
  vertical_days: 20     # give the swing thesis time to resolve
  # Cap barrier width as a % of entry. Post-shock ATR spikes would otherwise create
  # ~10% stops (bad risk geometry that also drowns the recovery signal in noise).
  max_barrier_pct: 0.08

features:           # §3 lookbacks in days/weeks
  momentum_windows: [5, 10, 20, 50]
  rsi_period: 14
  atr_period: 14
  bb_period: 20
  vol_window: 20
  value_lookback: 252   # ~1y for relative-value percentiles

model:              # §5
  type: hist_gbm        # hist_gbm | lightgbm (if installed)
  calibrate: true
  calibration_method: sigmoid   # sigmoid (fast Platt) | isotonic (flexible, slower)
  calibration_cv: 2
  meta_label: true
  min_train_samples: 250
  params:
    max_depth: 4
    learning_rate: 0.05
    max_iter: 300
    l2_regularization: 1.0
    min_samples_leaf: 20    # small enough to isolate the (rare) catalyst-edge rows

strategy:           # §5 conviction + meta-labeling, §7 principle gates
  # META-LABELING: the primary entry trigger is an explicit dislocation (catalyst OR
  # deep-value+quality); the ML model is the confidence FILTER on top (min_edge),
  # not the signal discoverer. So min_edge is a light floor near breakeven (~0.43),
  # NOT a high bar — the rule already ensures we're in edge-bearing territory.
  min_conviction: 0.0       # ranking/sizing only; the primary trigger does selection
  min_edge: 0.40            # model filter: veto only setups the model actively dislikes
  quality_gate: true        # buy discounted QUALITY, not cheap garbage
  require_catalyst_or_value: true
  catalyst_threshold: 0.6   # narrative_gap / recent_shock level that counts as a catalyst
  value_threshold: 0.75     # deep-value discount (vs own history) required for value entries
  quality_threshold: 0.60   # quality floor paired with deep value (anti value-trap)
  # CONCENTRATION (§ maximise returns): one clean shot per catalyst, not 6x re-entries
  # while the signal stays flagged. After a name is traded, it is on cooldown so the
  # book concentrates capital into distinct, high-conviction events.
  cooldown_days: 10         # min days before re-entering a name (sweep-optimal: cd10)
  concentrate: true         # tilt position size toward the highest-conviction names

risk:               # §7 survival first — tuned toward RETURN MAXIMISATION (still capped)
  risk_per_trade: 0.020     # 2.0% equity at risk to the stop (capital-utilisation sweep)
  kelly_fraction: 0.6       # 0.6-Kelly cap (more aggressive, still damped for survival)
  conviction_tilt: 0.6      # extra size for top-conviction names (0 = flat, 1 = strong tilt)
  max_positions: 6          # fewer, bigger, higher-conviction positions (concentration)
  max_weight_per_name: 0.30 # sweep-optimal (paired with risk_per_trade so sizing bites)
  max_gross_exposure: 1.0
  max_sector_positions: 3
  vol_target_annual: 0.15   # throttle exposure toward this

backtest:           # §6 honesty
  initial_equity: 100000
  commission_bps: 2.0       # 2 bps per side
  slippage_bps: 5.0         # 5 bps per side
  gap_aware_exits: true      # gap through a stop fills at the open (realistic), not the stop
  train_window_days: 504    # ~2y rolling train
  test_window_days: 90      # ~1 quarter OOS per fold (fewer, steadier retrains)
  purge_days: 20            # >= max holding to kill label overlap leakage
  embargo_days: 5

review:             # §8 self-critique thresholds
  min_trades_for_change: 30
  overfit_sharpe_ratio: 0.6    # OOS/IS Sharpe below this => overfit flag
  alpha_decay_windows: 3
